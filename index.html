
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family:Inter;
  background:#050505;
  color:white;
}

header {
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:rgba(255,255,255,.05);
}

nav a {
  color:white;
  margin-left:20px;
  text-decoration:none;
}

.hero {
  height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1 {
  font-family:Cinzel;
  font-size:70px;
  background:linear-gradient(90deg,white,gold);
  -webkit-background-clip:text;
  color:transparent;
}

.btn {
  background:gold;
  padding:12px 25px;
  color:black;
  text-decoration:none;
}

.calc-box {
  background:rgba(122,63,255,.2);
  border:2px solid #7A3FFF;
  box-shadow:0 0 25px #7A3FFF;
  padding:30px;
  max-width:600px;
  margin:auto;
}

input, select {
  width:100%;
  padding:8px;
  margin:10px 0;
}

.admin {
  background:#111;
  margin:40px;
  padding:20px;
  border-radius:10px;
}

</style>

</head>

<body>

<header>

<img src="logo.png" height="60">

<div>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>
</div>

<nav>
  <a href="about.html">About</a>
  <a href="residential.html">Residential</a>
  <a href="commercial.html">Commercial</a>
  <a href="blog.html">Blog</a>
</nav>

</header>

<section class="hero">
  <h1>Tiger Tech Consulting</h1>
  <p>Smart Homes • IT • Lighting</p>
  <a href="#quote" class="btn">Get Quote</a>
</section>

<section id="quote">
<h2 style="text-align:center">Build Your Quote</h2>

<div class="calc-box">

<select id="category">
  <option value="">Select Service</option>
  <option value="lighting">Lighting</option>
  <option value="audio">Audio</option>
  <option value="video">Video</option>
</select>

<div id="options"></div>

<h3 id="total">$0</h3>
<div id="breakdown"></div>

<button onclick="download()">Download Quote</button>
<button onclick="book()">Book Now</button>

</div>
</section>

<!-- USER HISTORY -->
<h2 style="text-align:center;">Your Quote History</h2>
<div id="history"></div>

<!-- ADMIN DASHBOARD -->
<h2 style="text-align:center;">Admin Dashboard</h2>
<div id="admin" class="admin"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// ✅ FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCNJ8ryHB9x3iCQPi3lG4-m-RBqEiuWWmQ",
  authDomain: "tiger-tech-consulting.firebaseapp.com",
  projectId: "tiger-tech-consulting"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// ✅ AUTH FUNCTIONS
function signup(){
  auth.createUserWithEmailAndPassword(email.value, password.value);
}

function login(){
  auth.signInWithEmailAndPassword(email.value, password.value);
}

function logout(){
  auth.signOut();
}

// ✅ TRACK USER
auth.onAuthStateChanged(user =>{
  currentUser = user;

  if(user){
    loadHistory(user.uid);
    loadAdmin(); // ✅ loads admin data too
  }
});

// ✅ BOOKING
function book(){
  window.open("https://calendly.com/lane-smith-tigertechconsulting/smart-home-tech-consultation");
}

// ✅ DOWNLOAD
function download(){
  let text = breakdown.innerText;
  let blob = new Blob([text], {type:"text/plain"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "quote.txt";
  a.click();
}

// ✅ CALCULATOR
const options = document.getElementById("options");

category.onchange = function(){
  let v = this.value;

  options.innerHTML = "";

  if(v === "lighting"){
    options.innerHTML = `<input id="qty" placeholder="Units">`;
  }

  if(v === "audio"){
    options.innerHTML = `<input id="qty" placeholder="Speakers">`;
  }

  if(v === "video"){
    options.innerHTML = `<select id="mount">
      <option value="yes">Wall Mount Included</option>
      <option value="no">Call for Quote</option>
    </select>`;
  }
};

// ✅ CALCULATE + SAVE
document.addEventListener("input", () => {

  let qty = document.getElementById("qty")?.value || 0;

  let materials = qty * 150;
  let labor = 125 * 4;
  let total = (materials + labor) * 1.3;

  totalDisplay.innerHTML = "$" + Math.round(total);

  breakdown.innerHTML = `
    Materials: $${materials}<br>
    Labor: $${labor}<br>
    Total: $${Math.round(total)}
  `;

  if(currentUser){
    db.collection("quotes").add({
      uid: currentUser.uid,
      total: Math.round(total),
      date: new Date().toLocaleString()
    });
  }

});

// ✅ LOAD USER HISTORY
function loadHistory(uid){
  db.collection("quotes")
    .where("uid","==",uid)
    .get()
    .then(snapshot=>{
      let html="";
      snapshot.forEach(doc=>{
        let d = doc.data();
        html += `<p>$${d.total} — ${d.date}</p>`;
      });
      history.innerHTML = html;
    });
}

// ✅ ✅ ADMIN DASHBOARD
function loadAdmin(){
  db.collection("quotes").get().then(snapshot=>{

    let html = "<h3>All Quotes</h3>";

    snapshot.forEach(doc=>{
      let d = doc.data();

      html += `
        <div style="border-bottom:1px solid #555; padding:10px;">
          <p><strong>$${d.total}</strong></p>
          <p>${d.date}</p>

          <button onclick="editQuote('${doc.id}', ${d.total})">Edit</button>
          <button onclick="deleteQuote('${doc.id}')">Delete</button>
        </div>
      `;
    });

    admin.innerHTML = html;
  });
}

// ✅ DELETE
function deleteQuote(id){
  db.collection("quotes").doc(id).delete().then(loadAdmin);
}

// ✅ EDIT
function editQuote(id, oldValue){
  let newValue = prompt("Edit Quote Amount:", oldValue);

  if(newValue){
    db.collection("quotes").doc(id).update({
      total: parseInt(newValue)
    }).then(loadAdmin);
  }
}

</script>

</body>
</html>
``
