
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting | Smart Home & Lighting Virginia Beach</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family:Inter;
  background:#050505;
  color:white;
}

/* NAV */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  background:rgba(255,255,255,.05);
}

nav a {
  color:white;
  margin-left:20px;
  text-decoration:none;
}

/* HERO */
.hero {
  height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1 {
  font-family:Cinzel;
  font-size:70px;
  background:linear-gradient(90deg,white,gold);
  -webkit-background-clip:text;
  color:transparent;
}

.btn {
  background:gold;
  padding:12px 25px;
  color:black;
  text-decoration:none;
}

/* QUOTE BOX */
.calc-box {
  background:rgba(122,63,255,.2);
  border:2px solid #7A3FFF;
  box-shadow:0 0 25px #7A3FFF;
  padding:30px;
  max-width:600px;
  margin:auto;
}

input, select {
  width:100%;
  padding:10px;
  margin:10px 0;
}

/* ADMIN */
.admin {
  background:#111;
  margin:40px;
  padding:20px;
  border-radius:10px;
}

</style>

</head>

<body>

<header>

<img src="logo.png" height="60">

<div>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>
</div>

<nav>
  <a href="about.html">About</a>
  <a href="residential.html">Residential</a>
  <a href="commercial.html">Commercial</a>
  <a href="blog.html">Blog</a>
</nav>

</header>

<section class="hero">
  <h1>Tiger Tech Consulting</h1>
  <p>Smart Homes • IT • Lighting</p>
  <a href="#quote" class="btn">Get Quote</a>
</section>

<section id="quote">
<h2 style="text-align:center">Build Your Quote</h2>

<div class="calc-box">

<select id="category">
  <option value="">Select Service</option>
  <option value="lighting">Lighting</option>
  <option value="audio">Audio</option>
  <option value="video">Video</option>
</select>

<div id="options"></div>

<h3 id="total">$0</h3>
<div id="breakdown"></div>

<button onclick="download()">Download Quote</button>
<button onclick="book()">Book Now</button>

</div>
</section>

<!-- USER HISTORY -->
<h2 style="text-align:center;">Your Quote History</h2>
<div id="history"></div>

<!-- GOOGLE REVIEWS -->
<section style="padding:60px; text-align:center;">
<h2 style="font-family:Cinzel;">Customer Reviews</h2>

<iframe src="https://www.google.com/maps?q=Tiger+Tech+Consulting&output=embed"
width="100%" height="300" style="border:0;"></iframe>
</section>

<!-- ADMIN -->
<h2 style="text-align:center;">Admin Dashboard</h2>
<div id="admin" class="admin"></div>

<!-- ✅ FIREBASE SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// ✅ CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "tiger-tech-consulting.firebaseapp.com",
  projectId: "tiger-tech-consulting"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// ✅ AUTH
function signup(){
  auth.createUserWithEmailAndPassword(email.value, password.value)
  .then(()=>alert("Account created!"));
}

function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(()=>alert("Logged in!"));
}

function logout(){
  auth.signOut();
}

// ✅ USER TRACKING
auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user){
    loadHistory(user.uid);
    loadAdmin();
  }
});

// ✅ BOOK
function book(){
  window.open("https://calendly.com/lane-smith-tigertechconsulting/smart-home-tech-consultation");
}

// ✅ DOWNLOAD
function download(){
  let text = breakdown.innerText;
  let blob = new Blob([text], {type:"text/plain"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "quote.txt";
  a.click();
}

// ✅ ELEMENTS
const options = document.getElementById("options");
const totalDisplay = document.getElementById("total");
const breakdown = document.getElementById("breakdown");

// ✅ CATEGORY SWITCH
document.getElementById("category").addEventListener("change", function(){

  options.innerHTML = "";

  if(this.value === "lighting"){
    options.innerHTML = `<input id="qty" placeholder="Number of Lights">`;
  }

  if(this.value === "audio"){
    options.innerHTML = `<input id="qty" placeholder="Number of Speakers">`;
  }

  if(this.value === "video"){
    options.innerHTML = `
      <select id="mount">
        <option value="yes">Wall Mount Included</option>
        <option value="no">Call for Quote</option>
      </select>`;
  }

});

// ✅ CALCULATE
document.addEventListener("input", function(){

  let qty = parseInt(document.getElementById("qty")?.value || 0);

  let materials = qty * 150;
  let labor = 125 * 4;
  let total = Math.round((materials + labor) * 1.3);

  totalDisplay.innerHTML = "$" + total;

  breakdown.innerHTML = `
  Materials: $${materials}<br>
  Labor: $${labor}<br>
  Total: $${total}
  `;

  if(currentUser){
    db.collection("quotes").add({
      uid: currentUser.uid,
      total: total,
      date: new Date().toLocaleString()
    });
  }

});

// ✅ USER HISTORY
function loadHistory(uid){
  db.collection("quotes").where("uid","==",uid).get()
  .then(snapshot=>{
    let html="";
    snapshot.forEach(doc=>{
      let d = doc.data();
      html += `<p>$${d.total} — ${d.date}</p>`;
    });
    history.innerHTML = html;
  });
}

// ✅ ADMIN
function loadAdmin(){
  db.collection("quotes").get().then(snapshot=>{
    let html = "<h3>All Quotes</h3>";

    snapshot.forEach(doc=>{
      let d = doc.data();
      html += `
        <div>
          <p><b>$${d.total}</b></p>
          <p>${d.date}</p>
          <button onclick="editQuote('${doc.id}',${d.total})">Edit</button>
          <button onclick="deleteQuote('${doc.id}')">Delete</button>
        </div>
      `;
    });

    admin.innerHTML = html;
  });
}

// ✅ DELETE
function deleteQuote(id){
  db.collection("quotes").doc(id).delete().then(loadAdmin);
}

// ✅ EDIT
function editQuote(id, value){
  let newVal = prompt("Edit Amount:", value);
  if(newVal){
    db.collection("quotes").doc(id).update({ total: parseInt(newVal) }).then(loadAdmin);
  }
}

</script>

</body>
</html>
