/* PARTICLES */

/* ANIMATIONS */

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// FIREBASE CONFIG
firebase.initializeApp({
  apiKey: "AIzaSyCNJ8ryHB9x3iCQPi3lG4-m-RBqEiuWWmQ",
  authDomain: "tiger-tech-consulting.firebaseapp.com",
  projectId: "tiger-tech-consulting"
});

const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;

function signup(){
  auth.createUserWithEmailAndPassword(email.value,password.value);
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value);
}

function book(){
  window.open("https://calendly.com/lane-smith-tigertechconsulting/smart-home-tech-consultation");
}

const options = document.getElementById("options");
const totalDisplay = document.getElementById("total");
const breakdown = document.getElementById("breakdown");

document.getElementById("category").onchange = function(){
  if(this.value==="lighting"){
    options.innerHTML=`<input id="qty" placeholder="Units">`;
  }
};

document.addEventListener("input",()=>{

  let qty = document.getElementById("qty")?.value||0;

  let total = Math.round((qty*150+125*4)*1.3);

  totalDisplay.innerHTML="$"+total;

  breakdown.innerHTML = `Total: $${total}`;

  if(currentUser){
    db.collection("quotes").add({
      uid:currentUser.uid,
      total:total
    });
  }

});

/* PARTICLE SYSTEM */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles=[];

for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
ctx.fillStyle="gold";
ctx.fillRect(p.x,p.y,3,3);

p.x+=p.dx;
p.y+=p.dy;

particles.forEach(p2=>{
let dist=Math.hypot(p.x-p2.x,p.y-p2.y);
if(dist<100){
ctx.strokeStyle="rgba(255,215,0,0.1)";
ctx.beginPath();
ctx.moveTo(p.x,p.y);
ctx.lineTo(p2.x,p2.y);
ctx.stroke();
}
});
});

requestAnimationFrame(animate);
}
animate();

</script>
