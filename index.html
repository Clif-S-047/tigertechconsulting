
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting Estimator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

/* CENTERED LAYOUT */
.section{
max-width:700px;
margin:auto;
padding:40px 20px;
}

/* BOX */
.calc-box{
background:#111;
padding:25px;
border-radius:10px;
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
color:white;
border:1px solid #333;
border-radius:5px;
}

/* NEON GOLD FOCUS */
input:focus,select:focus{
outline:none;
border-color:gold;
box-shadow:0 0 10px gold;
}

/* TOTAL */
#total{
font-size:42px;
color:gold;
text-align:center;
margin-top:20px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
color:black;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="section">

<h1 style="text-align:center;">Project Estimator</h1>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="tv">TV Mounting</option>
<option value="govee">Govee Lighting</option>
</select>

<div id="options"></div>

<div id="total">$0</div>

<button onclick="resetCalc()">Reset</button>

</div>

</div>

<script>

const options=document.getElementById("options");
const totalDisplay=document.getElementById("total");
const category=document.getElementById("category");

/* CATEGORY SWITCH */
category.addEventListener("change",()=>{

options.innerHTML="";

/* ✅ TV MOUNTING */
if(category.value==="tv"){
options.innerHTML=`

<select id="tvSize">
<option value="">TV Size</option>
<option value="small">Under 50"</option>
<option value="medium">50"-65"</option>
<option value="large">70"-85"</option>
<option value="xl">90"+</option>
</select>

<select id="mountType">
<option value="">Mount Location</option>
<option value="standard">Standard</option>
<option value="fireplace">Above Fireplace</option>
</select>

<select id="wallType">
<option value="">Wall Type</option>
<option value="drywall">Drywall</option>
<option value="brick">Brick</option>
<option value="stone">Stone</option>
<option value="concrete">Concrete</option>
</select>

`;
}


/* ✅ GOVEE LIGHTING */
if(category.value==="govee"){
options.innerHTML=`

<select id="model">
<option value="">Select Model</option>
<option value="pro">Govee Pro</option>
<option value="prism">Govee Prism</option>
</select>

<select id="length">
<option value="">Length</option>
<option value="100">100ft</option>
<option value="150">150ft</option>
<option value="200">200ft</option>
</select>

<select id="install">
<option value="">Installation Type</option>
<option value="standard">Standard</option>
<option value="premium">Premium (Tracks)</option>
</select>

<select id="stories">
<option value="">Home Type</option>
<option value="single">Single Story</option>
<option value="multi">Multi-Story</option>
</select>

`;
}

});

/* CALCULATE */
document.addEventListener("change", calculate);

function calculate(){

/* ================= TV LOGIC ================= */
if(category.value==="tv"){

let size=document.getElementById("tvSize")?.value;
let mount=document.getElementById("mountType")?.value;
let wall=document.getElementById("wallType")?.value;

if(!size||!mount||!wall){
totalDisplay.innerHTML="$0";
return;
}

let total=0;

/* SIZE */
if(size==="small") total=250;
if(size==="medium") total=375;
if(size==="large") total=450;
if(size==="xl") total=600;

/* FIREPLACE */
if(mount==="fireplace") total+=100;

/* WALL TYPE */
if(wall==="brick") total+=125;
if(wall==="stone") total+=150;
if(wall==="concrete") total+=175;

totalDisplay.innerHTML="$"+total;
return;
}

/* ================= GOVEE LOGIC ================= */
if(category.value==="govee"){

let model=document.getElementById("model")?.value;
let length=document.getElementById("length")?.value;
let install=document.getElementById("install")?.value;
let stories=document.getElementById("stories")?.value;

if(!model||!length||!install||!stories){
totalDisplay.innerHTML="$0";
return;
}

let total=0;

/* LIGHT COST */
if(model==="pro"){
if(length==="100") total+=439.98;
if(length==="150") total+=599.98;
if(length==="200") total+=759.98;
}

if(model==="prism"){
if(length==="100") total+=539.98;
if(length==="150") total+=699.99;
if(length==="200") total+=859.98;
}

/* INSTALL COST */
if(model==="pro"){

if(install==="standard"){
if(length==="100") total+=125;
if(length==="150") total+=200;
if(length==="200") total+=275;
}

if(install==="premium"){
if(length==="100") total+=625;
if(length==="150") total+=937.5;
if(length==="200") total+=1250;
}

}

if(model==="prism"){

if(install==="standard"){
total+=150;
}

if(install==="premium"){
if(length==="100") total+=725;
if(length==="150") total+=1037.5;
if(length==="200") total+=1450;
}

}

/* STORY TYPE */
if(stories==="multi"){
total+=775; // boom lift
}

/* LABOR ADJUST */
if(stories==="single"){
total+=300; // 2 tech estimate
}
if(stories==="multi"){
total+=600; // 3 tech estimate
}

/* MARKUP */
total = total * 1.3;

/* FINAL */
totalDisplay.innerHTML="$"+Math.round(total);

}

}

/* RESET */
function resetCalc(){
options.innerHTML="";
totalDisplay.innerHTML="$0";
category.value="";
}

</script>

</body>
</html>
