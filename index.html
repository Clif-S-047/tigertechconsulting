
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Estimator</title>

<style>

body {
  font-family: Arial;
  background:#111;
  color:white;
  padding:20px;
}

.calc-box {
  background:#222;
  padding:20px;
  max-width:500px;
  margin:auto;
  border-radius:10px;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
}

#total {
  font-size:28px;
  color:gold;
}

button {
  margin-top:10px;
  padding:10px;
  width:100%;
}

</style>

</head>

<body>

<h1 style="text-align:center;">Tiger Tech Estimator</h1>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="lighting">Lighting</option>
<option value="audio">Audio</option>
<option value="video">Video</option>
<option value="network">Networking</option>
<option value="garage">Garage Door</option>
</select>

<div id="options"></div>

<h2 id="total">$0</h2>
<div id="breakdown"></div>

<button onclick="resetCalc()">Reset</button>

</div>

<script>

const category = document.getElementById("category");
const options = document.getElementById("options");
const totalDisplay = document.getElementById("total");
const breakdown = document.getElementById("breakdown");

/* ✅ CREATE INPUT AFTER SELECTION */
category.addEventListener("change", function(){

options.innerHTML = "";

if(!this.value){
resetCalc();
return;
}

options.innerHTML = `
<label>Enter Quantity</label>
<input id="qty" type="number" min="1">
`;

/* ✅ FORCE CALC CHECK AFTER ELEMENT EXISTS */
setTimeout(calculate, 100);

});

/* ✅ CALCULATE */
document.addEventListener("input", calculate);
document.addEventListener("change", calculate);

function calculate(){

let qtyField = document.getElementById("qty");

if(!qtyField){
return;
}

let qty = parseInt(qtyField.value);

/* ✅ WAIT UNTIL USER ENTERS VALUE */
if(isNaN(qty) || qty <= 0){
totalDisplay.innerHTML="$0";
breakdown.innerHTML="";
return;
}

/* ✅ SAFE CATEGORY READ */
let type = category.value;

/* ✅ PRICING */
let materialRate = 150;
let laborHours = 4;

if(type === "lighting"){
materialRate = 180;
laborHours = qty * 0.5 + 1;
}

if(type === "audio"){
materialRate = 120;
laborHours = qty * 0.6 + 1.5;
}

if(type === "video"){
materialRate = 100;
laborHours = 2;
}

if(type === "network"){
materialRate = 90;
laborHours = qty * 0.75 + 1;
}

if(type === "garage"){
materialRate = 250;
laborHours = 3;
}

/* ✅ LABOR */
let labor = (laborHours * 125) + (laborHours * 80);

/* ✅ OTHER COSTS */
let travel = 50;
let overhead = 0.30;
let profit = 0.20;

/* ✅ FINAL */
let subtotal = (qty * materialRate) + labor + travel;
let total = Math.round(subtotal * (1 + overhead + profit));

/* ✅ DISPLAY */
totalDisplay.innerHTML = "$" + total;

breakdown.innerHTML = `
Materials: $${qty * materialRate}<br>
Labor: $${Math.round(labor)}<br>
Travel: $${travel}<br>
Overhead: 30%<br>
Profit: 20%<br>
<strong>Total: $${total}</strong>
`;

}

/* ✅ RESET */
function resetCalc(){
category.value="";
options.innerHTML="";
totalDisplay.innerHTML="$0";
breakdown.innerHTML="";
}

</script>

</body>
</html>
