
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top, #2a0f4d, #050505);
  color:white;
}

/* HERO */
.hero {
  text-align:center;
  padding:80px 20px;
}

.hero h1 {
  font-family:Cinzel;
  font-size:48px;
}

/* ESTIMATOR */
.calc-box {
  background:#111;
  border:2px solid #7A3FFF;
  padding:25px;
  border-radius:10px;
  max-width:500px;
  margin:auto;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
}

#total {
  font-size:28px;
  color:gold;
}

button {
  padding:10px;
  margin-top:10px;
  width:100%;
  cursor:pointer;
}

</style>

</head>

<body>

<section class="hero">
<h1>Tiger Tech Consulting</h1>
<p>Project Estimator</p>
</section>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="lighting">Lighting</option>
<option value="audio">Audio</option>
<option value="video">Video</option>
<option value="network">Networking</option>
<option value="garage">Garage Door</option>
</select>

<div id="options"></div>

<h2 id="total">$0</h2>
<div id="breakdown"></div>

<button onclick="resetCalc()">Reset</button>

</div>

<script>

/* MAIN ELEMENTS */
const category = document.getElementById("category");
const options = document.getElementById("options");
const totalDisplay = document.getElementById("total");
const breakdown = document.getElementById("breakdown");

/* CATEGORY CHANGE */
category.addEventListener("change", function(){

options.innerHTML = "";

if(this.value === ""){
totalDisplay.innerHTML="$0";
return;
}

/* ALWAYS CREATE INPUT */
options.innerHTML = `
<label>Enter Quantity</label>
<input type="number" id="qty" min="1" placeholder="Enter number">
`;

});

/* ✅ GLOBAL CALCULATION FUNCTION */
function calculate(){

let qtyField = document.getElementById("qty");

if(!qtyField){
totalDisplay.innerHTML = "$0";
breakdown.innerHTML = "";
return;
}

let qty = parseInt(qtyField.value);

if(!qty || qty <= 0){
totalDisplay.innerHTML="$0";
breakdown.innerHTML="";
return;
}

/* SERVICE TYPE */
let type = category.value;

/* PRICING */
let materialRate = 150;
let laborHours = 4;

/* LOGIC PER SERVICE */
if(type === "lighting"){
materialRate = 180;
laborHours = qty * 0.5 + 1;
}

if(type === "audio"){
materialRate = 120;
laborHours = qty * 0.6 + 1.5;
}

if(type === "video"){
materialRate = 100;
laborHours = 2;
}

if(type === "network"){
materialRate = 90;
laborHours = qty * 0.75 + 1;
}

if(type === "garage"){
materialRate = 250;
laborHours = 3;
}

/* LABOR */
let lead = 125;
let assist = 80;
let labor = (laborHours * lead) + (laborHours * assist);

/* OTHER COSTS */
let travel = 50;
let overhead = 0.30;
let profit = 0.20;

/* FINAL */
let subtotal = (qty * materialRate) + labor + travel;
let total = Math.round(subtotal * (1 + overhead + profit));

/* DISPLAY */
totalDisplay.innerHTML = "$" + total;

breakdown.innerHTML = `
Materials: $${qty * materialRate}<br>
Labor: $${Math.round(labor)}<br>
Travel: $${travel}<br>
Overhead: 30%<br>
Profit: 20%<br>
<strong>Total: $${total}</strong>
`;

}

/* ✅ LISTEN TO INPUT PROPERLY */
document.addEventListener("input", calculate);

/* RESET */
function resetCalc(){
category.value="";
options.innerHTML="";
totalDisplay.innerHTML="$0";
breakdown.innerHTML="";
}

</script>

</body>
</html>
