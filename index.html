
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting Estimator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

/* CENTER */
.section{
max-width:750px;
margin:auto;
padding:40px 20px;
}

/* BOX */
.calc-box{
background:#111;
padding:25px;
border-radius:10px;
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
color:white;
border:1px solid #333;
border-radius:5px;
}

/* NEON GOLD */
input:focus,select:focus{
outline:none;
border-color:gold;
box-shadow:0 0 10px gold;
}

/* TOTAL */
#total{
font-size:42px;
color:gold;
text-align:center;
margin-top:20px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
color:black;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="section">

<h1 style="text-align:center;">Project Estimator</h1>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="tv">TV Mounting</option>
<option value="govee">Govee Lighting</option>
</select>

<div id="options"></div>

<div id="total">$0</div>

<button onclick="resetCalc()">Reset</button>

</div>

</div>

<script>

const options=document.getElementById("options");
const totalDisplay=document.getElementById("total");
const category=document.getElementById("category");

/* CATEGORY SWITCH */
category.addEventListener("change",()=>{

options.innerHTML="";

/* ================= TV ================= */
if(category.value==="tv"){
options.innerHTML=`

<select id="tvSize">
<option value="">TV Size</option>
<option value="small">Under 50"</option>
<option value="medium">50"-65"</option>
<option value="large">70"-85"</option>
<option value="xl">90"+</option>
</select>

<select id="mountType">
<option value="">Mount Location</option>
<option value="standard">Standard Wall</option>
<option value="fireplace">Above Fireplace</option>
</select>

<select id="wallType">
<option value="">Wall Type</option>
<option value="drywall">Drywall</option>
<option value="brick">Brick</option>
<option value="stone">Stone</option>
<option value="concrete">Concrete</option>
</select>

<select id="tvBacklight">
<option value="">Add Backlight?</option>
<option value="none">No</option>
<option value="55">TV Backlight 3 Pro (55-65")</option>
<option value="75">TV Backlight 3 Pro (75-85")</option>
</select>

`;
}

/* ================= GOVEE ================= */
if(category.value==="govee"){
options.innerHTML=`

<select id="model">
<option value="">Select Type</option>
<option value="pro">Govee Pro</option>
<option value="prism">Govee Prism</option>
<option value="strip">Govee Outdoor LED Strip</option>
</select>

<select id="length">
<option value="">Length</option>
<option value="100">100ft</option>
<option value="150">150ft</option>
<option value="200">200ft</option>

<option value="32">32.8ft</option>
<option value="65">65.6ft</option>
<option value="98">98.4ft</option>
</select>

<select id="install">
<option value="">Installation</option>
<option value="standard">Standard</option>
<option value="premium">Premium Tracks</option>
</select>

<select id="stories">
<option value="">Home Type</option>
<option value="single">Single Story</option>
<option value="multi">Multi-Story</option>
</select>

`;
}

});

/* CALCULATE */
document.addEventListener("change",calculate);

function calculate(){

let total=0;

/* ================= TV ================= */
if(category.value==="tv"){

let size=document.getElementById("tvSize")?.value;
let mount=document.getElementById("mountType")?.value;
let wall=document.getElementById("wallType")?.value;
let backlight=document.getElementById("tvBacklight")?.value;

if(!size||!mount||!wall){
totalDisplay.innerHTML="$0";
return;
}

/* Base */
if(size==="small") total=250;
if(size==="medium") total=375;
if(size==="large") total=450;
if(size==="xl") total=600;

/* Fireplace */
if(mount==="fireplace") total+=100;

/* Wall */
if(wall==="brick") total+=125;
if(wall==="stone") total+=150;
if(wall==="concrete") total+=175;

/* Backlight */
if(backlight==="55") total+=179.98;
if(backlight==="75") total+=209.98;

}

/* ================= GOVEE ================= */
if(category.value==="govee"){

let model=document.getElementById("model")?.value;
let length=document.getElementById("length")?.value;
let install=document.getElementById("install")?.value;
let stories=document.getElementById("stories")?.value;

if(!model||!length||!install||!stories){
totalDisplay.innerHTML="$0";
return;
}

/* LIGHT COST */
if(model==="pro"){
if(length==="100") total+=439.98;
if(length==="150") total+=599.98;
if(length==="200") total+=759.98;
}

if(model==="prism"){
if(length==="100") total+=539.98;
if(length==="150") total+=699.99;
if(length==="200") total+=859.98;
}

if(model==="strip"){
if(length==="32") total+=74.99;
if(length==="65") total+=139.98;
if(length==="98") total+=189.98;
}

/* INSTALL */
if(model==="pro"){
if(install==="standard"){
if(length==="100") total+=125;
if(length==="150") total+=200;
if(length==="200") total+=275;
}
if(install==="premium"){
if(length==="100") total+=625;
if(length==="150") total+=937.5;
if(length==="200") total+=1250;
}
}

if(model==="prism"){
if(install==="standard") total+=150;
if(install==="premium"){
if(length==="100") total+=725;
if(length==="150") total+=1037.5;
if(length==="200") total+=1450;
}
}

if(model==="strip"){
if(install==="premium"){
if(length==="32") total+=225;
if(length==="65") total+=337.5;
if(length==="98") total+=450;
}
}

/* STORY */
if(stories==="multi") total+=775;

/* LABOR */
if(stories==="single") total+=300;
if(stories==="multi") total+=600;

}

/* ✅ FINAL MARKUP */
total = total * 1.3;

/* OUTPUT */
totalDisplay.innerHTML="$"+Math.round(total);

}

/* RESET */
function resetCalc(){
options.innerHTML="";
totalDisplay.innerHTML="$0";
category.value="";
}

</script>

</body>
</html>
