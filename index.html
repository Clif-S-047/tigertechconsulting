
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting | Estimator System</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family:Inter;
  background:#050505;
  color:white;
}

/* HERO */
.hero {
  text-align:center;
  padding:80px 20px;
}
.hero h1 {
  font-family:Cinzel;
  font-size:50px;
}

/* BOX */
.calc-box {
  background:#111;
  border:2px solid #7A3FFF;
  padding:30px;
  max-width:650px;
  margin:auto;
  border-radius:15px;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
}

/* RESULT */
#total {
  font-size:30px;
  color:gold;
}

button {
  padding:12px;
  margin-top:10px;
  cursor:pointer;
}

/* MOBILE */
@media (max-width:768px){
  .hero h1 {font-size:32px;}
}

</style>
</head>

<body>

<section class="hero">
<h1>Tiger Tech Consulting</h1>
<p>Professional Project Estimator</p>
</section>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="lighting">Lighting Installation</option>
<option value="audio">Audio System</option>
<option value="video">Video / TV Mount</option>
<option value="network">Networking</option>
<option value="garage">Garage Door</option>
</select>

<div id="options"></div>

<h3 id="total">$0</h3>
<div id="breakdown"></div>

<button onclick="resetCalc()">Reset</button>
<button onclick="downloadPDF()">Download PDF</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyCNJ8ryHB9x3iCQPi3lG4-m-RBqEiuWWmQ",
  projectId:"tiger-tech-consulting"
});

const db = firebase.firestore();

/* ELEMENTS */
const options = document.getElementById("options");
const totalDisplay = document.getElementById("total");
const breakdown = document.getElementById("breakdown");

/* CATEGORY */
document.getElementById("category").onchange = function(){

let v = this.value;
options.innerHTML = "";

if(v === "lighting"){
options.innerHTML = `
<select id="type">
<option value="">Indoor or Outdoor</option>
<option value="indoor">Indoor</option>
<option value="outdoor">Outdoor</option>
</select>
<input id="qty" placeholder="Number of Fixtures">
`;
}

if(v === "audio"){
options.innerHTML = `<input id="qty" placeholder="Number of Speakers">`;
}

if(v === "video"){
options.innerHTML = `
<select id="mount">
<option value="">Wall Mount?</option>
<option value="yes">Yes</option>
<option value="no">No</option>
</select>
`;
}

if(v === "network"){
options.innerHTML = `<input id="qty" placeholder="Data Drops">`;
}

if(v === "garage"){
options.innerHTML = `<input id="qty" placeholder="Units">`;
}

};

/* CALCULATOR LOGIC */
document.addEventListener("input", () => {

let qty = parseInt(document.getElementById("qty")?.value || 0);
if(!qty || qty <= 0){
totalDisplay.innerHTML="$0";
breakdown.innerHTML="";
return;
}

/* REALISTIC VB PRICING */
let materialRate = 0;
let laborHours = 0;
let laborRateLead = 125;
let laborRateAssist = 80;
let assistants = 1;

/* CATEGORY LOGIC */
let category = document.getElementById("category").value;

if(category === "lighting"){
materialRate = 180; // fixtures
laborHours = qty * 0.5; // per fixture
}

if(category === "audio"){
materialRate = 120;
laborHours = qty * 0.6;
}

if(category === "video"){
materialRate = 75;
laborHours = 2;
let mount = document.getElementById("mount")?.value;
if(mount === "yes"){
materialRate += 160;
}
}

if(category === "network"){
materialRate = 90;
laborHours = qty * 0.75;
}

if(category === "garage"){
materialRate = 250;
laborHours = 3;
}

/* CALCULATIONS */
let materialCost = qty * materialRate;
let laborCost = (laborHours * laborRateLead) +
                (laborHours * laborRateAssist * assistants);

let travel = 50; // average VB cost
let overhead = 0.30;
let profit = 0.20;

/* FINAL */
let subtotal = materialCost + laborCost + travel;
let total = subtotal * (1 + overhead + profit);

total = Math.round(total);

/* DISPLAY */
totalDisplay.innerHTML = "$" + total;

breakdown.innerHTML = `
Materials: $${materialCost}<br>
Labor: $${Math.round(laborCost)}<br>
Travel: $${travel}<br>
Overhead: 30%<br>
Profit: 20%<br>
<strong>Total: $${total}</strong>
`;

/* SAVE TO FIREBASE */
db.collection("quotes").add({
category,
total,
date:new Date().toLocaleString()
});

});

/* RESET */
function resetCalc(){
document.getElementById("category").value="";
options.innerHTML="";
totalDisplay.innerHTML="$0";
breakdown.innerHTML="";
}

/* PDF DOWNLOAD */
function downloadPDF(){

let content = breakdown.innerText;

let blob = new Blob([content], {type:"text/plain"});
let link = document.createElement("a");

link.href = URL.createObjectURL(blob);
link.download = "TigerTechQuote.txt";
link.click();

}

/* EMAIL (AUTO SEND SIMPLE FORM) */
function sendEmailEstimate(){

let value = breakdown.innerText;

fetch("https://formsubmit.co/ajax/YOUR_EMAIL", {
method:"POST",
headers:{'Content-Type':'application/json'},
body: JSON.stringify({
message:value
})
});

}

</script>

</body>
</html>
