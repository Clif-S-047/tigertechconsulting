
OCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter&display=swap" rel="stylesheet">

<style>

body { margin:0; font-family:Inter; background:#050505; color:white; }

header {
display:flex; justify-content:space-between; padding:20px;
background:rgba(255,255,255,.05);
}

nav a { color:white; margin-left:20px; text-decoration:none; }

.hero {
height:80vh; display:flex; flex-direction:column;
justify-content:center; align-items:center; text-align:center;
}

.hero h1 {
font-family:Cinzel; font-size:70px;
background:linear-gradient(90deg,white,gold);
-webkit-background-clip:text; color:transparent;
}

.btn {
background:gold; padding:12px 25px;
color:black; text-decoration:none;
}

.calc-box {
background:rgba(122,63,255,.2);
border:2px solid #7A3FFF;
box-shadow:0 0 25px #7A3FFF;
padding:30px;
max-width:600px;
margin:auto;
}

input, select { width:100%; padding:8px; margin:10px 0; }

</style>
</head>

<body>

<header>
<img src="logo.png" height="60">

<nav>
<a href="about.html">About</a>
<a href="residential.html">Residential</a>
<a href="commercial.html">Commercial</a>
<a href="blog.html">Blog</a>
</nav>
</header>

<section class="hero">
<h1>Tiger Tech Consulting</h1>
<p>Smart Homes • IT • Lighting</p>
<a href="#quote" class="btn">Get Quote</a>
</section>

<section id="quote">
<h2 style="text-align:center">Build Your Quote</h2>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="lighting">Lighting</option>
<option value="audio">Audio</option>
<option value="video">Video</option>
<option value="network">Networking</option>
<option value="camera">Ring / Nest Cameras</option>
</select>

<div id="options"></div>

<h3 id="total">$0</h3>
<div id="breakdown"></div>

<button onclick="download()">Download Quote</button>
<button onclick="book()">Book Now</button>

</div>
</section>

<script>

function book(){
window.open("https://calendly.com/lane-smith-tigertechconsulting/smart-home-tech-consultation");
}

function download(){
let text = document.getElementById("breakdown").innerText;
let blob = new Blob([text], {type:"text/plain"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "quote.txt";
a.click();
}

const options = document.getElementById("options");
const totalDisplay = document.getElementById("total");

document.getElementById("category").onchange = function(){
let v=this.value;
options.innerHTML="";

if(v==="lighting"){
options.innerHTML=`
<select id="type">
<option value="">Indoor/Outdoor</option>
<option value="indoor">Indoor</option>
<option value="outdoor">Outdoor</option>
</select>
<input id="qty" placeholder="Units">
`;
}

if(v==="audio"){
options.innerHTML=`<input id="qty" placeholder="Speakers">`;
}

if(v==="video"){
options.innerHTML=`
<select id="mount">
<option value="yes">Wall Mount Included</option>
<option value="no">Call for Quote</option>
</select>`;
}

};

document.addEventListener("input",()=>{
let qty = document.getElementById("qty")?.value||0;
let total = qty*150;
let labor = 125*4;
let overhead = 1.3;

let final = (total+labor)*overhead;

totalDisplay.innerHTML="$"+Math.round(final);

document.getElementById("breakdown").innerHTML=
`Materials: $${total}<br>
Labor: $${labor}<br>
Total: $${Math.round(final)}`;
});

</script>

</body>
</html>
