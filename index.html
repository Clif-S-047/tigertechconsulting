
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

/* LAYOUT */
.section-container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

/* BOX */
.calc-box{
background:#111;
padding:25px;
border-radius:10px;
max-width:500px;
margin:auto;
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
color:white;
border:1px solid #333;
border-radius:5px;
}

/* ✅ GLOW EFFECT */
input:focus, select:focus{
outline:none;
border-color:gold;
box-shadow:0 0 10px gold;
}

/* TOTAL */
#total{
font-size:40px;
color:gold;
text-align:center;
margin-top:20px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
color:black;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="section-container">

<h1 style="text-align:center;">Project Estimator</h1>

<div class="calc-box">

<select id="category">
<option value="">Select Service</option>
<option value="tv">TV Mounting</option>
<option value="lighting">Lighting</option>
</select>

<div id="options"></div>

<div id="total">$0</div>

<button onclick="resetCalc()">Reset</button>

</div>

</div>

<script>

const options=document.getElementById("options");
const totalDisplay=document.getElementById("total");
const category=document.getElementById("category");

/* CATEGORY */
category.addEventListener("change",()=>{

options.innerHTML="";

if(category.value==="tv"){
options.innerHTML=`

<select id="tvSize">
<option value="">TV Size</option>
<option value="small">Under 50"</option>
<option value="medium">50"-65"</option>
<option value="large">70"-85"</option>
<option value="xl">90"+</option>
</select>

<select id="mountType">
<option value="">Mount Location</option>
<option value="standard">Standard Wall</option>
<option value="fireplace">Above Fireplace</option>
</select>

<select id="wallType">
<option value="">Wall Type</option>
<option value="drywall">Drywall</option>
<option value="brick">Brick</option>
<option value="stone">Stone</option>
<option value="concrete">Concrete</option>
</select>

`;

}

});

/* CALCULATE */
document.addEventListener("change",calculate);

function calculate(){

if(category.value!=="tv") return;

/* GET VALUES */
let size=document.getElementById("tvSize")?.value;
let mount=document.getElementById("mountType")?.value;
let wall=document.getElementById("wallType")?.value;

/* WAIT UNTIL ALL SELECTED */
if(!size||!mount||!wall){
totalDisplay.innerHTML="$0";
return;
}

/* BASE PRICE */
let total=0;

/* SIZE PRICING */
if(size==="small") total=250;
if(size==="medium") total=375;
if(size==="large") total=450;
if(size==="xl") total=600;

/* FIREPLACE ADD */
if(mount==="fireplace") total+=100;

/* WALL TYPE ADD */
if(wall==="brick") total+=125;
if(wall==="stone") total+=150;
if(wall==="concrete") total+=175;

/* FINAL */
totalDisplay.innerHTML="$"+total;

}

/* RESET */
function resetCalc(){
options.innerHTML="";
totalDisplay.innerHTML="$0";
category.value="";
}

</script>

</body>
</html>
