<script>

// FIREBASE INIT
firebase.initializeApp({
  apiKey: "AIzaSyCNJ8ryHB9x3iCQPi3lG4-m-RBqEiuWWmQ",
  authDomain: "tiger-tech-consulting.firebaseapp.com",
  projectId: "tiger-tech-consulting"
});

const auth = firebase.auth();
const db = firebase.firestore();
let currentUser=null;

// LOGIN
function signup(){ auth.createUserWithEmailAndPassword(email.value,password.value);}
function login(){ auth.signInWithEmailAndPassword(email.value,password.value);}

function book(){
  window.open("https://calendly.com/lane-smith-tigertechconsulting/smart-home-tech-consultation");
}

// CALCULATOR
document.getElementById("category").onchange=function(){
  options.innerHTML=`<input id="qty" placeholder="Units">`;
};

document.addEventListener("input",()=>{
  let qty=document.getElementById("qty")?.value||0;
  let total=Math.round((qty*150+125*4)*1.3);
  totalDisplay.innerHTML="$"+total;
  breakdown.innerHTML="Total: $"+total;
});

// PARTICLES
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let count=window.innerWidth<768?40:80;
let particles=[];

for(let i=0;i<count;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
ctx.fillStyle="gold";
ctx.fillRect(p.x,p.y,2,2);

p.x+=p.dx;
p.y+=p.dy;
});

requestAnimationFrame(animate);
}
animate();

</script>
