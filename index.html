
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger Tech Consulting | Smart Home Virginia Beach</title>

<meta name="description" content="Smart home, LED lighting, and IT services in Virginia Beach, Chesapeake, and Norfolk. Get an estimate or book today.">

<link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Inter&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body{
margin:0;
font-family:Inter;
background:linear-gradient(to bottom,#1a0033,#050505);
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:20px;
background:#0008;
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
}

/* HERO */
.hero{
text-align:center;
padding:100px 20px;
}

.hero h1{
font-family:Cinzel;
font-size:50px;
}

/* BUTTON */
.btn{
background:gold;
padding:10px 20px;
color:black;
display:inline-block;
margin:10px;
cursor:pointer;
}

/* SECTION */
section{padding:40px;}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* BOX */
.box{
background:#111;
padding:20px;
border-radius:10px;
}

/* TOTAL */
#total{
font-size:40px;
color:gold;
text-align:center;
}

/* INPUT */
input,select{width:100%;padding:10px;margin-top:10px;}

button{padding:10px;margin-top:10px;width:100%;}

/* MOBILE */
@media(max-width:768px){
.hero h1{font-size:32px;}
}

/* PARTICLES */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

</style>
</head>

<body>

<canvas id="c"></canvas>

<header>
<div>Tiger Tech</div>

<nav>
<a href="#estimate">Estimate</a>
<a href="#portfolio">Portfolio</a>
<a href="#store">Store</a>
<a href="#contact">Contact</a>
<a href="virginia-beach.html">VB</a>
<a href="chesapeake.html">Chesapeake</a>
<a href="norfolk.html">Norfolk</a>
</nav>

</header>

<div class="hero">
<h1>Tiger Tech Consulting</h1>
<p>Smart Home • Lighting • IT</p>
<a class="btn" href="#estimate">Get Estimate</a>
</div>

<!-- ESTIMATOR -->
<section id="estimate">
<h2>Estimator</h2>

<select id="category">
<option value="">Select</option>
<option value="lighting">Lighting</option>
<option value="audio">Audio</option>
<option value="video">Video</option>
</select>

<div id="options"></div>

<div id="total">$0</div>

<button onclick="resetCalc()">Reset</button>
</section>

<!-- DASHBOARD -->
<section>
<h2>Your Saved Quotes</h2>
<div id="quotes"></div>
</section>

<!-- STORE -->
<section id="store">
<h2>Store</h2>

<div class="grid">

<div class="box">
Smart Thermostat $199
<button onclick="addItem('Thermostat',199)">Add</button>
</div>

<div class="box">
Lighting Kit $299
<button onclick="addItem('Lighting Kit',299)">Add</button>
</div>

</div>

<h3>Cart</h3>
<div id="cart"></div>
<button onclick="checkout()">Checkout</button>

</section>

<!-- PORTFOLIO -->
<section id="portfolio">
<h2>Projects</h2>

<div class="grid">
<div class="box">Smart Home Install</div>
<div class="box">Lighting Upgrade</div>
<div class="box">Theater Setup</div>
</div>

</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact</h2>

<form action="https://formsubmit.co/YOUR_EMAIL" method="POST" onsubmit="return validate();">

<input id="name" name="name" placeholder="Name" required>
<input id="email" type="email" name="email" placeholder="Email" required>

<textarea name="message" placeholder="Message"></textarea>

<button type="submit">Send</button>

</form>

</section>

<script>

/* ESTIMATOR */
const category=document.getElementById("category");
const options=document.getElementById("options");
const totalDisplay=document.getElementById("total");

category.onchange=()=>{
options.innerHTML='<input id="qty" type="number" placeholder="Qty">';
};

document.addEventListener("input",()=>{

let qty=parseInt(document.getElementById("qty")?.value);

if(!qty){totalDisplay.innerHTML="$0";return;}

let rate=150;
let labor=qty*100;

let total=qty*rate + labor;

totalDisplay.innerHTML="$"+total;

/* SAVE */
let saved=JSON.parse(localStorage.getItem("quotes")||"[]");
saved.push(total);
localStorage.setItem("quotes",JSON.stringify(saved));
loadQuotes();

});

/* LOAD DASHBOARD */
function loadQuotes(){
let data=JSON.parse(localStorage.getItem("quotes")||"[]");
document.getElementById("quotes").innerHTML=data.map(x=>"$"+x).join("<br>");
}
loadQuotes();

/* RESET */
function resetCalc(){
options.innerHTML="";
totalDisplay.innerHTML="$0";
}

/* STORE */
let cart=[];

function addItem(name,price){
cart.push({name,price});
renderCart();
}

function renderCart(){
document.getElementById("cart").innerHTML=
cart.map(x=>x.name+" $"+x.price).join("<br>");
}

function checkout(){
alert("Checkout simulated. Connect Square for live payments.");
}

/* CONTACT VALIDATION */
function validate(){
let email=document.getElementById("email").value;
if(!email.includes("@")){
alert("Enter valid email");
return false;
}
return true;
}

/* PARTICLES */
let c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;
let p=[];

for(let i=0;i<30;i++){
p.push({x:Math.random()*c.width,y:Math.random()*c.height});
}

function draw(){
ctx.clearRect(0,0,c.width,c.height);
p.forEach(dot=>{
ctx.fillStyle="gold";
ctx.fillRect(dot.x,dot.y,2,2);
});
requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
